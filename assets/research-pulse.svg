
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="152" viewBox="0 0 1200 152" role="img" aria-label="Animated research interests">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101722"/>
      <stop offset="1" stop-color="#16182F"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D7E7"/>
      <stop offset=".55" stop-color="#548AEC"/>
      <stop offset="1" stop-color="#A65EF4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="152" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="150" rx="15" fill="none" stroke="#3D4865" stroke-width="1.5"/>

  <circle cx="51" cy="43" r="7" fill="#39D7E7">
    <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="74" y="51" fill="#B9C9E1" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="3" font-weight="700">CURRENT FOCUS</text>
  <text x="52" y="93" fill="#F0F5FF" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">AI-Machine Learning • Cybersecurity • Distributed Systems</text>

  <path d="M52 119 C260 98 412 137 601 120 S966 106 1148 120" fill="none" stroke="url(#track)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <circle r="8" fill="#63DFF3">
    <animateMotion dur="6.8s" repeatCount="indefinite" rotate="auto" path="M52 119 C260 98 412 137 601 120 S966 106 1148 120"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1076" cy="45" r="4" fill="#AD83FF" opacity=".55"/>
